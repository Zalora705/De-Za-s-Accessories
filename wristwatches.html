<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrist Watches | De Za's Accessories</title>
    <link rel="stylesheet" href="wristwatches.css">
</head>
<body class="product-page">
<a class="home-button" href="index.html">Back to Home</a>
<main>
    <header class="page-intro">
        <h1>Shop Wrist Watches</h1>
    </header>
    <section class="products" aria-label="Wrist watches for sale">
        <article class="product">
            <div class="product-image-wrap">
                <img class="product-image" src="wristwatches-img/tudorblackbayceramic.jpeg" alt="Tudor Black Bay Ceramic">
            </div>
            <h3>Tudor Black Bay Cereamic</h3>
            <div class="price">₦42,000</div>
            <button type="button">Add to Cart</button>
        </article>
        <article class="product">
            <div class="product-image-wrap">
                <img class="product-image" src="wristwatches-img/patekphilippenautilus.jpeg" alt="Patek Philippe Nautilus">
            </div>
            <h3>Patek Philippe Nautilus</h3>
            <div class="price">₦68,000</div>
            <button type="button">Add to Cart</button>
        </article>
        <article class="product">
            <div class="product-image-wrap">
                <img class="product-image" src="wristwatches-img/seiko5sports.jpeg" alt="Seiko 5 Sports">
            </div>
            <h3>Seiko 5 Sports</h3>
            <div class="price">₦95,000</div>
            <button type="button">Add to Cart</button>
        </article>
        <article class="product">
            <div class="product-image-wrap">
                <img class="product-image" src="wristwatches-img/rolexoysterperpetualday-date.jpeg" alt="Rolex Oyster Perpetual Day-date">
            </div>
            <h3>Rolex Oyster Perpetual Day-date</h3>
            <div class="price">₦55,000</div>
            <button type="button">Add to Cart</button>
        </article>
    </section>
</main>
</body>
</html>
